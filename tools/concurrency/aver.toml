[providers]
schema = 1

[[providers.bindings]]
capability = "Domain.Primitives"
crate = "btc_listener_primitives"
package = "btc-listener-primitives"
path = "../../providers/primitives"
factory = "primitives_binding"

[[providers.bindings]]
capability = "Pulse"
answer = "Prepared"

[[providers.bindings]]
capability = "Preparation"
work = "Prepared.prepare"
task = "Prepared.nextTask"
started = "Prepared.taskStarted"
landed = "Prepared.landed"

[work]
max-jobs = 1

[run]

[[providers.bindings]]
capability = "Wire"
answer = "Socketed"
